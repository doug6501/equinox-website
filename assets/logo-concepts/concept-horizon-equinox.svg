<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Concept: horizon equinox">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD23F"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
  </defs>
  <rect width="320" height="120" fill="#0A0A1A"/>
  <!-- Sun half visible at equinox line -->
  <line x1="24" y1="68" x2="296" y2="68" stroke="#4169E1" stroke-width="2" opacity="0.6"/>
  <path d="M 160 68 A 36 36 0 0 1 160 4 A 36 36 0 0 1 160 68 Z" fill="url(#sunGrad)"/>
  <text x="160" y="102" text-anchor="middle" fill="#f5f5f5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">EQUINOX</text>
  <text x="160" y="116" text-anchor="middle" fill="#FF6B35" font-family="system-ui, sans-serif" font-size="7" font-weight="500" letter-spacing="0.2em">AUDIO VISUALS</text>
</svg>
