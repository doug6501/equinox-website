<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Concept: sound wave meets light">
  <rect width="320" height="120" fill="#0A0A1A"/>
  <!-- Audio waves -->
  <path d="M 32 60 Q 48 40 64 60 T 96 60 T 128 60" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 32 72 Q 52 52 72 72 T 112 72" fill="none" stroke="#FFD23F" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- Light beam / projection -->
  <path d="M 200 28 L 268 92 L 200 92 Z" fill="#4169E1" opacity="0.35"/>
  <path d="M 200 28 L 268 92" stroke="#4169E1" stroke-width="2" fill="none"/>
  <path d="M 200 28 L 200 92" stroke="#4169E1" stroke-width="2" fill="none"/>
  <circle cx="200" cy="28" r="5" fill="#FFD23F"/>
  <text x="160" y="112" text-anchor="middle" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em">EQUINOX AUDIO VISUALS</text>
</svg>
