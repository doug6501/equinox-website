<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Concept: Vermont peaks and spotlight">
  <rect width="320" height="120" fill="#0A0A1A"/>
  <!-- Mountains -->
  <path d="M 24 88 L 72 44 L 108 72 L 148 36 L 188 88 Z" fill="#2D3748"/>
  <path d="M 108 88 L 156 52 L 200 88 Z" fill="#1a1a2e"/>
