  <path d="M 148 36 L 168 88 L 128 88 Z" fill="#FF6B35" opacity="0.25"/>
  <line x1="148" y1="36" x2="148" y2="88" stroke="#FFD23F" stroke-width="1.5" opacity="0.8"/>
  <!-- Stars / rig lights -->
  <circle cx="248" cy="38" r="2" fill="#f5f5f5"/>
  <circle cx="268" cy="52" r="1.5" fill="#f5f5f5" opacity="0.7"/>
  <circle cx="288" cy="40" r="2" fill="#4169E1"/>
  <text x="160" y="108" text-anchor="middle" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.1em">EQUINOX AUDIO VISUALS</text>
</svg>
