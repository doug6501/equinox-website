<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Concept: balanced rings equinox">
  <rect width="320" height="120" fill="#0A0A1A"/>
  <g transform="translate(88,60)">
    <!-- Dual arcs suggesting day/night balance -->
    <path d="M -40 0 A 40 40 0 0 1 40 0" fill="none" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
    <path d="M -40 0 A 40 40 0 0 0 40 0" fill="none" stroke="#4169E1" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <circle cx="0" cy="0" r="8" fill="#FFD23F"/>
  </g>
  <text x="200" y="52" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="0.05em">EQUINOX</text>
  <text x="200" y="72" fill="#FF6B35" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.2em">AUDIO VISUALS</text>
</svg>
