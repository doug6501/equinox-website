<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Concept: minimal mark for favicon use">
  <rect width="320" height="120" fill="#0A0A1A"/>
  <!-- Stacked horizontal bars = EQ + levels -->
  <g transform="translate(48, 32)">
    <rect x="0" y="0" width="56" height="8" rx="2" fill="#FF6B35"/>
    <rect x="0" y="16" width="40" height="8" rx="2" fill="#FFD23F"/>
    <rect x="0" y="32" width="48" height="8" rx="2" fill="#f5f5f5" opacity="0.9"/>
    <rect x="0" y="48" width="32" height="8" rx="2" fill="#4169E1"/>
  </g>
  <text x="130" y="58" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.02em">Equinox</text>
  <text x="130" y="78" fill="#B87333" font-family="system-ui, sans-serif" font-size="10" font-weight="500" letter-spacing="0.15em">AUDIO VISUALS</text>
</svg>
